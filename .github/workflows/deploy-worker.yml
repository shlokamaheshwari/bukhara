name: Deploy Worker

# Only push events on main deploy — PRs never touch production.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-worker
  cancel-in-progress: false # never cut off a deploy midway

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: []

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guardrail: never deploy if the tests are broken.
      - name: Type-check worker
        run: npm run check:worker

      - name: Run rules-engine tests
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
